<!DOCTYPE html>
<html lang="en">
<head>
    <title>MedNote Selection</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/static/css/selectionPage.css">
</head>
<body>
    <h1>MedNote</h1>
    <main>
        <article>
            <div id="container">
                <div class="checkbox-container">
                    <form id="selection-form">
                        <label for="option1">Name</label>
                        <input type="checkbox" id="option1" name="option1" value="Name"><br>
                        
                        <label for="option2">Date of Birth:</label>
                        <input type="checkbox" id="option2" name="option2" value="Date of Birth"><br>
                        
                        <label for="option3">Date of Visit:</label>
                        <input type="checkbox" id="option3" name="option3" value="Date of Visit"><br>
                
                        <label for="option4">Provider:</label>
                        <input type="checkbox" id="option4" name="option4" value="Provider"><br>
                
                        <label for="option5">Chief Complaint:</label>
                        <input type="checkbox" id="option5" name="option5" value="Chief Complaint"><br>
                
                        <label for="option6">History of Present Illness (HPI):</label>
                        <input type="checkbox" id="option6" name="option6" value="History of Present Illness (HPI)"><br>
                
                        <label for="option7">Onset:</label>
                        <input type="checkbox" id="option7" name="option7" value="Onset"><br>
                
                        <label for="option8">Duration:</label>
                        <input type="checkbox" id="option8" name="option8" value="Duration"><br>
                
                        <label for="option9">Location:</label>
                        <input type="checkbox" id="option9" name="option9" value="Location"><br>
                
                        <label for="option10">Severity:</label>
                        <input type="checkbox" id="option10" name="option10" value="Severity"><br>
                
                        <label for="option11">Characteristics:</label>
                        <input type="checkbox" id="option11" name="option11" value="Characteristics"><br>
                
                        <label for="option12">Aggravating Factors:</label>
                        <input type="checkbox" id="option12" name="option12" value="Aggravating Factors"><br>
                
                        <label for="option13">Relieving Factors:</label>
                        <input type="checkbox" id="option13" name="option13" value="Relieving Factors"><br>
                
                        <label for="option14">Physical Examination:</label>
                        <input type="checkbox" id="option14" name="option14" value="Physical Examination"><br>
                
                        <label for="option15">Vital Signs:</label>
                        <input type="checkbox" id="option15" name="option15" value="Vital Signs"><br>
                
                        <label for="option16">General Appearance:</label>
                        <input type="checkbox" id="option16" name="option16" value="General Appearance"><br>
                
                        <label for="option17">Relevant Findings:</label>
                        <input type="checkbox" id="option17" name="option17" value="Relevant Findings"><br>
                
                        <label for="option18">Assessment and Plan:</label>
                        <input type="checkbox" id="option18" name="option18" value="Assessment and Plan"><br>
                
                        <label for="option19">Diagnosis:</label>
                        <input type="checkbox" id="option19" name="option19" value="Diagnosis"><br>
                
                        <label for="option20">Plan:</label>
                        <input type="checkbox" id="option20" name="option20" value="Plan"><br>
                
                        <label for="option21">Patient Education:</label>
                        <input type="checkbox" id="option21" name="option21" value="Patient Education"><br>
                
                        <label for="option22">Follow-Up:</label>
                        <input type="checkbox" id="option22" name="option22" value="Follow-Up"><br>
                
                        <label for="option23">Instructions:</label>
                        <input type="checkbox" id="option23" name="option23" value="Instructions"><br>
                
                        <label for="option24">Provider’s Name:</label>
                        <input type="checkbox" id="option24" name="option24" value="Provider’s Name"><br>
                
                        <label for="option25">Date:</label>
                        <input type="checkbox" id="option25" name="option25" value="Date"><br>
                
                        <label for="option26">ICD-10 Codes:</label>
                        <input type="checkbox" id="option26" name="option26" value="ICD-10 Codes"><br>
                    </form>
                </div>
                

                <!-- Textarea to display selected content -->
                <div class="selected-content-container">
                    <!-- <label for="selected-content">Selected Content:</label> -->
                    <textarea id="selected-content" rows="10" cols="40" readonly></textarea>
                </div>
            </div>

            
        </article>
    </main>
    
    <script src="/static/js/selectionPage.js"></script>
    
</body>
</html>
