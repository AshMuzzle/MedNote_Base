services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_ACCELERATE=1
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 30s
      timeout: 10s
      retries: 30
    volumes:
      - ollama_data:/root/.ollama
      - env_data:/ollama/.env

  flask:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - env_data:/app/.env
    working_dir: /app
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
  env_data:
